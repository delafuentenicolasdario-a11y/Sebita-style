<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sebita Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0A0A0A; color: white; font-family: sans-serif; }
        .gold { background: linear-gradient(135deg, #D4AF37, #B8962E); color: black; }
    </style>
</head>
<body class="pb-20 p-6">
    <div id="app" class="max-w-md mx-auto">
        <!-- LOGIN -->
        <div id="view-login">
            <h1 class="text-4xl font-black text-yellow-500 text-center mb-8 italic">SEBITA STYLE</h1>
            <input id="email" type="email" placeholder="Email" class="w-full p-4 mb-4 rounded-xl bg-zinc-900 border border-zinc-800">
            <input id="pass" type="password" placeholder="Contraseña" class="w-full p-4 mb-4 rounded-xl bg-zinc-900 border border-zinc-800">
            <button onclick="login()" class="w-full gold p-4 rounded-xl font-bold uppercase">Entrar</button>
            <button onclick="register()" class="w-full text-zinc-500 mt-4 text-sm">¿Nuevo? Regístrate aquí</button>
        </div>

        <!-- CLIENTE -->
        <div id="view-home" class="hidden">
            <h2 class="text-xl mb-4 text-yellow-500">Hola, <span id="u-name"></span></h2>
            <div class="gold p-8 rounded-3xl text-center mb-6">
                <p class="text-xs font-bold uppercase italic">Mis Puntos</p>
                <p id="u-points" class="text-6xl font-black italic">0</p>
            </div>
            <div id="admin-area" class="hidden border-t border-zinc-800 pt-6">
                <h3 class="font-bold mb-4">Panel Barbero ✂️</h3>
                <input id="s-email" type="text" placeholder="Email del cliente" class="w-full p-3 bg-zinc-900 rounded-lg mb-2">
                <button onclick="search()" class="w-full bg-white text-black p-2 rounded-lg font-bold">Buscar Cliente</button>
                <div id="res" class="hidden mt-4 p-4 bg-zinc-800 rounded-lg">
                    <p id="res-n" class="font-bold"></p>
                    <button onclick="add(10)" class="w-full bg-yellow-600 p-2 mt-2 rounded">Sumar Corte (+10)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Pega aquí tus datos de Supabase ⚙️
        const SB_URL = "TU_URL_AQUÍ"; 
        const SB_KEY = "TU_KEY_ANON_AQUÍ";
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        async function login() {
            const { data, error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('pass').value
            });
            if (error) alert(error.message); else location.reload();
        }

        async function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) return alert(error.message);
            await supabase.from('profiles').insert([{ id: data.user.id, first_name: 'Cliente', email: email }]);
            alert("¡Cuenta creada! Revisa tu email para confirmar y luego entra.");
        }

        async function check() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                const { data: p } = await supabase.from('profiles').select('*').eq('id', user.id).single();
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-home').classList.remove('hidden');
                document.getElementById('u-name').innerText = p.first_name;
                document.getElementById('u-points').innerText = p.total_points;
                if (p.role === 'admin') document.getElementById('admin-area').classList.remove('hidden');
            }
        }

        let selId = "";
        async function search() {
            const { data } = await supabase.from('profiles').select('*').eq('email', document.getElementById('s-email').value).single();
            if (data) {
                selId = data.id;
                document.getElementById('res-n').innerText = data.first_name + " (" + data.total_points + " pts)";
                document.getElementById('res').classList.remove('hidden');
            }
        }

        async function add(pts) {
            const { data: p } = await supabase.from('profiles').select('total_points').eq('id', selId).single();
            await supabase.from('profiles').update({ total_points: p.total_points + pts }).eq('id', selId);
            alert("Puntos sumados");
            search();
        }

        window.onload = check;
    </script>
</body>
</html>
